# Builds the installers: a universal macOS .dmg (ad-hoc signed, see docs/SIGNING.md) on a macOS
# runner and a Windows x64 installer (Inno Setup) on a Windows runner. Never cross-compiled.
# A Linux job runs the unit tests and a headless smoke run of the real UI.
name: Build app

on:
  workflow_dispatch:
    inputs:
      ffmpeg_release:
        description: Tag of the ffmpeg release to bundle (from the "ffmpeg (LGPL)" workflow)
        required: false
      release_tag:
        description: Optional. Also publish the installers as a GitHub pre-release under this tag (for example v0.2.0)
        required: false
  push:
    tags: ["v*"]

env:
  FFMPEG_RELEASE: ${{ inputs.ffmpeg_release || vars.FFMPEG_RELEASE || 'ffmpeg-n8.1.3-3' }}
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libmimalloc-dev libmpv-dev xvfb ffmpeg imagemagick python3 > /dev/null
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: flutter test
      - name: Headless smoke run
        run: |
          set -euo pipefail
          flutter build linux --release
          scripts/smoke-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: ignore

  mac:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch bundled ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg.sh mac "$FFMPEG_RELEASE"
      - name: Build, bundle ffmpeg, ad-hoc sign, make dmg
        run: scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Soundbites-mac
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch bundled ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: scripts/fetch-ffmpeg.sh win "$FFMPEG_RELEASE"
      - name: Build and make installer
        shell: pwsh
        run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Soundbites-windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Soundbites-*
          merge-multiple: true
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "${TAG}" dist/* --prerelease --target "${GITHUB_SHA}" --title "Soundbites ${TAG}" \
            --notes "Test build. Unsigned (ad-hoc on macOS): see docs/first-time-opening.md for the one-time steps. Bundled ffmpeg: ${FFMPEG_RELEASE}."
