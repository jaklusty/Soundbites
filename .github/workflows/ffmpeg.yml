# Builds the ffmpeg that ships inside Soundbites.
#
# Why our own build: the ready-made Apple Silicon binaries (osxexperts, used by ffmpeg-static) are
# configured with --enable-nonfree and may not be redistributed. This build is LGPL only:
# ffmpeg with its built-in codecs plus LAME (libmp3lame, LGPL) for MP3 clip encoding. No GPL
# parts, no autodetected system libraries, so the licence is known and the binary is portable.
#
# Output: a GitHub release tagged ffmpeg-<FFMPEG_TAG>-<run number> with
#   ffmpeg-mac-universal.zip   ffmpeg + ffprobe, arm64 and x86_64 joined with lipo
#   ffmpeg-win-x64.zip         ffmpeg.exe + ffprobe.exe, fully static
#   SHA256SUMS
#   the exact source tarballs used (LGPL source offer)
# The app build workflow fetches these into vendor/ffmpeg/.
name: ffmpeg (LGPL)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: FFmpeg git tag to build
        default: n8.1.3
        required: true

env:
  LAME_VERSION: "3.100"
  LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
  # Common configure flags. --disable-autodetect is the licence guard: nothing from the build
  # machine (Homebrew, system libs) is linked in by accident.
  FFMPEG_COMMON: >-
    --disable-shared --enable-static --disable-autodetect --disable-doc --disable-debug
    --disable-ffplay --disable-network --disable-devices --disable-htmlpages --disable-manpages
    --enable-libmp3lame --pkg-config-flags=--static

jobs:
  mac:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install nasm pkg-config
      - name: Sources
        run: |
          set -euo pipefail
          mkdir -p src dist
          curl -fsSL -o src/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz"
          echo "${LAME_SHA256}  src/lame.tar.gz" | shasum -a 256 -c -
          git clone --depth 1 --branch "${{ inputs.ffmpeg_tag }}" https://github.com/FFmpeg/FFmpeg src/ffmpeg
          git -C src/ffmpeg archive --format=tar.gz --prefix="ffmpeg-${{ inputs.ffmpeg_tag }}/" -o "$PWD/dist/ffmpeg-${{ inputs.ffmpeg_tag }}-source.tar.gz" HEAD
          cp src/lame.tar.gz "dist/lame-${LAME_VERSION}-source.tar.gz"
      - name: Build both architectures
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=11.0
          for ARCH in arm64 x86_64; do
            P="$PWD/prefix-$ARCH"
            rm -rf lame && mkdir lame && tar xzf src/lame.tar.gz -C lame --strip-components=1
            ( cd lame && ./configure --prefix="$P" --disable-shared --enable-static --disable-frontend --disable-decoder \
                --host="$ARCH-apple-darwin" CFLAGS="-arch $ARCH -O2" LDFLAGS="-arch $ARCH" && make -j"$(sysctl -n hw.ncpu)" && make install )
            rm -rf ff && cp -R src/ffmpeg ff
            EXTRA=""
            if [ "$ARCH" = "x86_64" ]; then EXTRA="--enable-cross-compile --arch=x86_64 --target-os=darwin"; fi
            ( cd ff && ./configure --prefix="$P" $FFMPEG_COMMON $EXTRA \
                --cc="clang -arch $ARCH" --extra-cflags="-I$P/include" --extra-ldflags="-L$P/lib" \
                && make -j"$(sysctl -n hw.ncpu)" && make install )
          done
          mkdir -p out
          for BIN in ffmpeg ffprobe; do
            lipo -create -output "out/$BIN" "prefix-arm64/bin/$BIN" "prefix-x86_64/bin/$BIN"
            lipo -info "out/$BIN"
          done
      - name: Licence and portability checks
        run: |
          set -euo pipefail
          CONF="$(out/ffmpeg -hide_banner -buildconf)"
          echo "$CONF"
          if echo "$CONF" | grep -q -- '--enable-gpl'; then echo "GPL flag present"; exit 1; fi
          if echo "$CONF" | grep -q -- '--enable-nonfree'; then echo "nonfree flag present"; exit 1; fi
          out/ffmpeg -hide_banner -version | head -3
          # Only system frameworks/libs may be dynamically linked.
          otool -L out/ffmpeg | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' && { echo "non-system dylib linked"; exit 1; } || true
          # Encoder/filter sanity: mp3 encode, wav output, loudness measurement, opus+aac decode present.
          out/ffmpeg -hide_banner -encoders | grep -q libmp3lame
          out/ffmpeg -hide_banner -encoders | grep -q pcm_s16le
          out/ffmpeg -hide_banner -decoders | grep -q -w opus
          out/ffmpeg -hide_banner -decoders | grep -q -w aac
          out/ffmpeg -hide_banner -filters | grep -q -w volumedetect
          out/ffmpeg -hide_banner -filters | grep -q -w ebur128
          out/ffmpeg -hide_banner -f lavfi -i "sine=frequency=440:duration=2" -c:a libmp3lame -b:a 128k -y /tmp/t.mp3
          out/ffmpeg -hide_banner -i /tmp/t.mp3 -af volumedetect -f null - 2>&1 | grep -q mean_volume
          echo "$CONF" > out/BUILDCONF.txt
          cp src/ffmpeg/COPYING.LGPLv2.1 out/COPYING.LGPLv2.1
          cp src/ffmpeg/LICENSE.md out/LICENSE.ffmpeg.md
          tar xzf src/lame.tar.gz --strip-components=1 -C out lame-${LAME_VERSION}/COPYING && mv out/COPYING out/COPYING.lame
          (cd out && zip -X ../dist/ffmpeg-mac-universal.zip ffmpeg ffprobe BUILDCONF.txt COPYING.LGPLv2.1 LICENSE.ffmpeg.md COPYING.lame)
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mac
          path: dist/*

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils zip tar
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Sources
        run: |
          set -euo pipefail
          mkdir -p src dist
          curl -fsSL -o src/lame.tar.gz "https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz"
          echo "${LAME_SHA256}  src/lame.tar.gz" | sha256sum -c -
          git clone --depth 1 --branch "${{ inputs.ffmpeg_tag }}" https://github.com/FFmpeg/FFmpeg src/ffmpeg
      - name: Build
        run: |
          set -euo pipefail
          P="$PWD/prefix"
          mkdir lame && tar xzf src/lame.tar.gz -C lame --strip-components=1
          ( cd lame && ./configure --prefix="$P" --disable-shared --enable-static --disable-frontend --disable-decoder CFLAGS="-O2" && make -j"$(nproc)" && make install )
          ( cd src/ffmpeg && ./configure --prefix="$P" $FFMPEG_COMMON --target-os=mingw64 \
              --extra-cflags="-I$P/include" --extra-ldflags="-L$P/lib -static" --extra-libs="-lpthread" \
              && make -j"$(nproc)" && make install )
          mkdir -p out && cp "$P/bin/ffmpeg.exe" "$P/bin/ffprobe.exe" out/
      - name: Licence and portability checks
        run: |
          set -euo pipefail
          CONF="$(out/ffmpeg.exe -hide_banner -buildconf)"
          echo "$CONF"
          if echo "$CONF" | grep -q -- '--enable-gpl'; then echo "GPL flag present"; exit 1; fi
          if echo "$CONF" | grep -q -- '--enable-nonfree'; then echo "nonfree flag present"; exit 1; fi
          # A static build should import only Windows system DLLs.
          objdump -p out/ffmpeg.exe | grep 'DLL Name' | grep -v -i -E 'KERNEL32|USER32|ADVAPI32|SHELL32|WS2_32|BCRYPT|OLE32|PSAPI|SHLWAPI|AVICAP32|MSVCRT|api-ms-win|ucrtbase|GDI32|OLEAUT32|SETUPAPI|IPHLPAPI|CRYPT32|SECUR32' && { echo "non-system DLL imported"; exit 1; } || true
          out/ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame
          out/ffmpeg.exe -hide_banner -decoders | grep -q -w opus
          out/ffmpeg.exe -hide_banner -filters | grep -q -w volumedetect
          out/ffmpeg.exe -hide_banner -f lavfi -i "sine=frequency=440:duration=2" -c:a libmp3lame -b:a 128k -y t.mp3
          echo "$CONF" > out/BUILDCONF.txt
          cp src/ffmpeg/COPYING.LGPLv2.1 out/COPYING.LGPLv2.1
          cp src/ffmpeg/LICENSE.md out/LICENSE.ffmpeg.md
          tar xzf src/lame.tar.gz --strip-components=1 -C out lame-${LAME_VERSION}/COPYING && mv out/COPYING out/COPYING.lame
          (cd out && zip -X ../dist/ffmpeg-win-x64.zip ffmpeg.exe ffprobe.exe BUILDCONF.txt COPYING.LGPLv2.1 LICENSE.ffmpeg.md COPYING.lame)
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win
          path: dist/*

  release:
    name: Publish ffmpeg release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp .github/workflows/ffmpeg.yml dist/build-recipe-ffmpeg.yml
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          TAG="ffmpeg-${{ inputs.ffmpeg_tag }}-${{ github.run_number }}"
          gh release create "$TAG" dist/* --title "ffmpeg ${{ inputs.ffmpeg_tag }} (LGPL) build ${{ github.run_number }}" \
            --notes "LGPL-only ffmpeg and ffprobe for Soundbites: FFmpeg ${{ inputs.ffmpeg_tag }} + LAME ${LAME_VERSION}, no GPL or nonfree components, no autodetected libraries. Source tarballs and the build recipe are attached to satisfy the LGPL source offer. See BUILDCONF.txt inside each zip for the exact configure line."
