name: soundbites
description: A desktop library of trending sounds for short-form video.
publish_to: 'none'
version: 0.2.2+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  crypto: ^3.0.7
  unorm_dart: ^0.3.3
  http: ^1.6.0
  archive: ^4.5.2
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_audio: ^1.0.7
  super_drag_and_drop: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - LICENSES/
