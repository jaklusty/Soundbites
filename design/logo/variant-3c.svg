<?xml version="1.0" encoding="UTF-8"?>
<!-- Soundbites app icon, variant 3c: five sound bars, scalloped chomp through the tallest bar with a trail of crumbs flying off, teal background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824x824 rounded square, corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#0B5E5A"/>

  <!-- Sound bars, cream, centred on y=512 (same as variants 3 and 3b) -->
  <g fill="#FFF1D6">
    <rect x="122" y="362" width="120" height="300" rx="60"/>
    <rect x="287" y="282" width="120" height="460" rx="60"/>
    <rect x="452" y="192" width="120" height="640" rx="60"/>
    <rect x="617" y="382" width="120" height="260" rx="60"/>
    <rect x="782" y="312" width="120" height="400" rx="60"/>
  </g>

  <!-- The chomp: big circle out of the right side of the tallest bar (same as variant 3b), tooth-mark scallops along the rim -->
  <g fill="#0B5E5A">
    <circle cx="642" cy="390" r="112"/>
    <circle cx="570" cy="476" r="32"/>
    <circle cx="540" cy="437" r="32"/>
    <circle cx="540" cy="343" r="32"/>
    <circle cx="570" cy="304" r="32"/>
    <circle cx="642" cy="502" r="32"/>
  </g>

  <!-- Crumbs: pieces of the bar flying up and to the right, shrinking with distance -->
  <g fill="#FFF1D6">
    <circle cx="704" cy="300" r="19"/>
    <circle cx="742" cy="308" r="8"/>
    <polygon points="730,278 752,258 756,284"/>
    <circle cx="778" cy="258" r="13"/>
    <polygon points="800,244 816,226 822,248"/>
    <circle cx="842" cy="232" r="9"/>
    <polygon points="862,220 874,212 874,226"/>
    <circle cx="888" cy="210" r="5"/>
    <circle cx="900" cy="206" r="3"/>
  </g>
</svg>
