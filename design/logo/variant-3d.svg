<?xml version="1.0" encoding="UTF-8"?>
<!-- Soundbites app icon, variant 3d: five sound bars, scalloped chomp through the tallest bar with a heavy fan of crumbs breaking away, teal background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824x824 rounded square, corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#0B5E5A"/>

  <!-- Sound bars, cream, centred on y=512 (same as variants 3 and 3b) -->
  <g fill="#FFF1D6">
    <rect x="122" y="362" width="120" height="300" rx="60"/>
    <rect x="287" y="282" width="120" height="460" rx="60"/>
    <rect x="452" y="192" width="120" height="640" rx="60"/>
    <rect x="617" y="382" width="120" height="260" rx="60"/>
    <rect x="782" y="312" width="120" height="400" rx="60"/>
  </g>

  <!-- The chomp: big circle out of the right side of the tallest bar (same as variant 3b), tooth-mark scallops along the rim -->
  <g fill="#0B5E5A">
    <circle cx="642" cy="390" r="112"/>
    <circle cx="570" cy="476" r="32"/>
    <circle cx="540" cy="437" r="32"/>
    <circle cx="540" cy="343" r="32"/>
    <circle cx="570" cy="304" r="32"/>
    <circle cx="642" cy="502" r="32"/>
  </g>

  <!-- Crumbs: a heavy fan of bar chunks breaking away up and to the right, shrinking with distance -->
  <g fill="#FFF1D6">
    <polygon points="700,262 748,228 766,282 722,300"/>
    <circle cx="790" cy="250" r="42"/>
    <circle cx="676" cy="232" r="30"/>
    <polygon points="826,214 852,200 850,232"/>
    <circle cx="868" cy="258" r="18"/>
    <circle cx="744" cy="196" r="14"/>
    <polygon points="776,184 792,176 790,198"/>
    <circle cx="810" cy="178" r="8"/>
    <circle cx="884" cy="224" r="9"/>
    <polygon points="872,196 884,192 882,206"/>
    <circle cx="902" cy="248" r="6"/>
    <circle cx="910" cy="280" r="4"/>
    <circle cx="712" cy="170" r="6"/>
    <circle cx="846" cy="176" r="4"/>
    <circle cx="906" cy="300" r="5"/>
  </g>
</svg>
