<?xml version="1.0" encoding="UTF-8"?>
<!-- Soundbites app icon, variant 3: five sound bars, bite out of the tallest bar, teal background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824x824 rounded square, corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#0B5E5A"/>

  <!-- Sound bars, cream, centred on y=512 -->
  <g fill="#FFF1D6">
    <rect x="122" y="362" width="120" height="300" rx="60"/>
    <rect x="287" y="282" width="120" height="460" rx="60"/>
    <rect x="452" y="192" width="120" height="640" rx="60"/>
    <rect x="617" y="382" width="120" height="260" rx="60"/>
    <rect x="782" y="312" width="120" height="400" rx="60"/>
  </g>

  <!-- The bite: a semicircle taken out of the right side of the tallest bar -->
  <circle cx="585" cy="350" r="68" fill="#0B5E5A"/>
</svg>
