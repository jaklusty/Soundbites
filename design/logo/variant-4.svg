<?xml version="1.0" encoding="UTF-8"?>
<!-- Soundbites app icon, variant 4: bold note silhouette, circular chomp with tooth marks, mustard background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824x824 rounded square, corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#F2B230"/>

  <!-- Chunky eighth note, near-black -->
  <g fill="#1C1A22">
    <!-- head -->
    <ellipse cx="380" cy="720" rx="195" ry="145" transform="rotate(-20 380 720)"/>
    <!-- stem -->
    <rect x="455" y="200" width="110" height="520"/>
    <!-- flag (deliberately fat so the chomp has something to bite) -->
    <path d="M 455 200
             C 700 200, 840 340, 800 640
             C 790 480, 700 440, 455 440 Z"/>
  </g>

  <!-- The chomp: a circle out of the flag, with small tooth marks along its rim -->
  <g fill="#F2B230">
    <circle cx="800" cy="300" r="115"/>
    <circle cx="712" cy="226" r="22"/>
    <circle cx="689" cy="270" r="22"/>
    <circle cx="687" cy="320" r="22"/>
    <circle cx="706" cy="366" r="22"/>
    <circle cx="742" cy="400" r="22"/>
  </g>
</svg>
