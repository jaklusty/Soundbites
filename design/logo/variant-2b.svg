<?xml version="1.0" encoding="UTF-8"?>
<!-- Soundbites app icon, variant 2b: beamed pair of eighth notes, big chomp with tooth marks out of the beam's top-right corner, dark background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS icon grid: 824x824 rounded square, corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#17141F"/>

  <!-- Notes, saffron (same composition as variant 2, shifted left so the chomp stays inside the grid) -->
  <g fill="#F6C453">
    <!-- left head and stem -->
    <ellipse cx="280" cy="760" rx="135" ry="100" transform="rotate(-20 280 760)"/>
    <rect x="351" y="320" width="60" height="450"/>
    <!-- right head and stem -->
    <ellipse cx="620" cy="695" rx="135" ry="100" transform="rotate(-20 620 695)"/>
    <rect x="691" y="255" width="60" height="450"/>
    <!-- beam joining the two stems (thicker than variant 2 so it survives the chomp) -->
    <path d="M 351 320 L 751 255 L 751 445 L 351 510 Z"/>
  </g>

  <!-- The chomp: a big circle out of the top-right corner of the beam, with tooth-mark scallops along its rim -->
  <g fill="#17141F">
    <circle cx="770" cy="235" r="115"/>
    <circle cx="750" cy="348" r="36"/>
    <circle cx="696" cy="323" r="36"/>
    <circle cx="662" cy="274" r="36"/>
  </g>
</svg>
