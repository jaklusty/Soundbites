# Packaging configuration. See docs/SIGNING.md for the signing switch.
appId: com.jaklusty.soundbites
productName: Soundbites
copyright: Copyright © 2026 Jak Lusty
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - LICENSES/**
# ffmpeg lives outside the asar so it can be executed. vendor/ffmpeg/<os>/ is filled by
# scripts/fetch-ffmpeg.mjs from the "ffmpeg-*" release produced by .github/workflows/ffmpeg.yml.
extraResources:
  - from: vendor/ffmpeg/${os}/
    to: ffmpeg
    filter: ["**/*"]
asar: true
compression: normal
npmRebuild: false

mac:
  category: public.app-category.music
  icon: build/icon.png
  target:
    - target: dmg
      arch: [universal]
  # --- Signing switch (see docs/SIGNING.md) -------------------------------------------------
  # No certificate yet: ad-hoc sign the whole bundle so Apple Silicon will run it.
  # electron-builder 26.15 has no automatic ad-hoc fallback, so this must stay explicit.
  identity: "-"
  hardenedRuntime: false   # must be true for notarisation; also needs the entitlement below
  notarize: false          # true once APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER are set
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # ------------------------------------------------------------------------------------------
  extendInfo:
    NSMicrophoneUsageDescription: Soundbites does not use the microphone.

dmg:
  sign: false
  contents:
    - x: 140
      y: 180
    - x: 420
      y: 180
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # No Authenticode certificate yet. SmartScreen will warn; see docs/first-time-opening.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Soundbites

publish:
  provider: github
  owner: jaklusty
  repo: soundbites
  releaseType: release
